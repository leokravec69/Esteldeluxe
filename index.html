<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estel DE LUXE — калькулятор рецепта</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  :root { --g0:#171515; --g1:#242222; --g2:#383431; --g3:#69635F; --l1:#C6C0BB; --l0:#F2F1EF; --mute:#A8A29D;
          --cobalt:#0871C9; --cyan:#1697D5; --orange:#E96C2E; --red:#D51C39; --magenta:#D91964; --violet:#795483; --dust:#B9818E; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 14px; line-height: 1.5; color: var(--l0);
         background: radial-gradient(ellipse at 50% 0%, #3b3633 0%, #242222 42%, rgba(23,21,21,0) 72%) top center / 100% 1000px no-repeat, #171515; min-height: 100vh; }
  .app { max-width: 780px; margin: 0 auto; padding: 0 20px 110px; }
  .colorcode { overflow: hidden; }
  .colorcode svg { display: block; width: 100%; height: 100%; }
  .brand { font-size: 11px; letter-spacing: 0.34em; color: var(--mute); text-transform: uppercase; }
  h1 { margin: 10px 0 8px; font-size: 38px; font-weight: 200; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.06; color: #fff; }
  .lead { font-size: 14px; font-weight: 300; color: var(--l1); max-width: 440px; margin: 0 0 22px; }
  .section-title { margin: 38px 0 14px; font-size: 11px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mute); }

  /* ---------- старт ---------- */
  .hero { position: relative; margin: 0 -20px; height: 580px; overflow: hidden; background: #171515; }
  .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 84% 16%; }
  .hero-stripes { position: absolute; left: 0; top: 0; bottom: 0; width: 60%; opacity: 0.42; -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 100%); mask-image: linear-gradient(90deg, #000 0%, transparent 100%); }
  .hero-stripes .colorcode { height: 100%; }
  .hero-shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,21,21,0.94) 0%, rgba(23,21,21,0.6) 34%, rgba(23,21,21,0) 66%), linear-gradient(90deg, rgba(23,21,21,0.5) 0%, rgba(23,21,21,0) 55%); }
  .hero-copy { position: absolute; left: 20px; right: 20px; bottom: 34px; max-width: 540px; }
  .cta { padding: 16px 28px; }
  @media (min-width: 640px) { .hero { height: 520px; } .hero-img { object-position: 100% 20%; } h1 { font-size: 46px; } }

  .how { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .how { grid-template-columns: repeat(3, 1fr); } }
  .how-card { position: relative; height: 230px; overflow: hidden; border: 1px solid var(--g2); }
  .how-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .how-card .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,21,21,0.94) 0%, rgba(23,21,21,0.35) 55%, rgba(23,21,21,0.05) 100%); }
  .how-card .txt { position: absolute; left: 16px; right: 16px; bottom: 14px; }
  .how-n { font-size: 36px; font-weight: 200; line-height: 1; color: #fff; }
  .how-t { margin-top: 6px; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; }
  .how-d { margin-top: 4px; font-size: 12px; font-weight: 300; color: var(--l1); }
  .mods { border-top: 1px solid var(--g2); }
  .mod { display: flex; align-items: center; gap: 16px; padding: 14px 4px; border-bottom: 1px solid var(--g2); cursor: pointer; }
  .mod:hover { background: rgba(255,255,255,0.03); }
  .mod-thumb { flex: 0 0 64px; height: 64px; background-size: cover; background-repeat: no-repeat; border: 1px solid var(--g2); }
  .mod-body { flex: 1; }
  .mod-name { font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #fff; }
  .mod-sub { font-size: 12px; font-weight: 300; color: var(--mute); margin-top: 2px; }
  .mod-go { font-size: 20px; font-weight: 200; color: var(--l1); }
  .mod.disabled { cursor: default; opacity: 0.5; }
  .mod.disabled:hover { background: transparent; }
  .mod.disabled .mod-thumb { filter: grayscale(1); }
  .soon { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); border: 1px solid var(--g3); padding: 3px 8px; }

  /* ---------- шапка шага ---------- */
  .stephero { position: relative; margin: 0 -20px; height: clamp(150px, 30vw, 210px); overflow: hidden; background: #171515; }
  .stephero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stephero-stripes { position: absolute; left: 0; top: 0; bottom: 0; width: 58%; opacity: 0.4; -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 100%); mask-image: linear-gradient(90deg, #000 0%, transparent 100%); }
  .stephero-stripes .colorcode { height: 100%; }
  .stephero-shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,21,21,0.92) 0%, rgba(23,21,21,0.25) 62%, rgba(23,21,21,0) 100%); }
  .stephero-copy { position: absolute; left: 20px; right: 20px; bottom: 16px; }
  .stephero-n { font-size: 11px; letter-spacing: 0.3em; color: var(--mute); }
  .stephero-t { font-size: 26px; font-weight: 200; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; line-height: 1.1; margin-top: 2px; }
  .stephero-s { font-size: 12px; font-weight: 300; color: var(--l1); margin-top: 4px; }

  .steps { display: flex; margin: 0 0 24px; border-bottom: 1px solid var(--g2); }
  .step-dot { flex: 1; padding: 14px 4px 11px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #77716c; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: default; text-align: left; }
  .step-dot.reachable { cursor: pointer; color: var(--l1); }
  .step-dot.reachable:hover { color: #fff; }
  .step-dot { white-space: nowrap; }
  @media (max-width: 520px) { .step-dot { font-size: 10px; letter-spacing: 0.07em; padding-left: 0; } }
  .step-dot.active { color: #fff; border-bottom-color: var(--cobalt); font-weight: 600; }
  .step-dot.done { color: var(--l1); border-bottom-color: var(--g3); }

  label { display: block; margin-top: 18px; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }
  select { width: 100%; padding: 9px; margin-top: 6px; font-size: 14px; border-radius: 2px; border: 1px solid var(--g3); background: var(--g1); color: var(--l0); }

  .chip-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .chip { padding: 10px 15px; border-radius: 2px; border: 1px solid var(--g3); background: transparent; font-size: 12px; font-weight: 400; letter-spacing: 0.03em; cursor: pointer; color: var(--l1); }
  .chip:hover { border-color: var(--l1); color: #fff; }
  .chip-active { background: var(--l0); color: var(--g0); border-color: var(--l0); font-weight: 600; }
  .chip-active.chip-red, .chip-active.chip-kb { background: rgba(213,28,57,0.22); border-color: var(--red); color: #fff; }
  .chip-active.chip-hb { background: rgba(22,151,213,0.22); border-color: var(--cyan); color: #fff; }
  .chip-locked { padding: 10px 15px; border-radius: 2px; border: 1px solid var(--red); background: rgba(213,28,57,0.12); color: #fff; font-size: 12px; display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; }

  .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
  button { padding: 13px 24px; border-radius: 2px; border: 1px solid transparent; font-family: inherit; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; font-weight: 600; }
  .btn-next { background: var(--l0); color: var(--g0); }
  .btn-next:hover { background: #fff; }
  .btn-back { background: transparent; color: var(--l1); border-color: var(--g3); }
  .btn-back:hover { color: #fff; border-color: var(--l1); }

  .panel-diagnosis, .panel-desired, .panel-recipe { padding: 0; background: transparent; }
  .zone-block { padding: 18px 18px 20px; margin-top: 16px; background: rgba(255,255,255,0.035); border: 1px solid var(--g2); border-left: 2px solid var(--g3); border-radius: 2px; }
  .zone-roots { border-left-color: var(--cobalt); }
  .zone-middle { border-left-color: var(--violet); }
  .zone-ends { border-left-color: var(--orange); }
  .zone-title { font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; margin-bottom: 2px; }
  .zone-sub { font-size: 12px; color: var(--mute); margin-bottom: 6px; }
  .zone-close { float: right; font-size: 11px; letter-spacing: 0.04em; text-transform: none; font-weight: 400; color: var(--mute); cursor: pointer; text-decoration: underline; }
  .zone-toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; padding: 16px 18px; border: 1px dashed var(--g3); border-left: 2px solid var(--g3); border-radius: 2px; cursor: pointer; font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #fff; }
  .zone-toggle:hover { background: rgba(255,255,255,0.05); border-color: var(--l1); }
  .zone-toggle.zone-middle { border-left-color: var(--violet); }
  .zone-toggle.zone-ends { border-left-color: var(--orange); }
  .zone-toggle-sub { font-size: 11px; font-weight: 300; letter-spacing: 0.02em; text-transform: none; color: var(--mute); text-align: right; }

  .tile-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .tile { width: 46px; height: 42px; border: 1px solid var(--g3); border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; color: var(--l1); background: transparent; }
  .tile:hover { border-color: var(--l1); color: #fff; }
  .tile-active { background: var(--l0); border-color: var(--l0); color: var(--g0); font-weight: 700; }
  .tile.level-tile { width: 44px; height: 66px; align-items: flex-end; padding-bottom: 7px; font-size: 20px; font-weight: 300; border-color: transparent; }
  .tile.level-tile:hover { border-color: var(--l1); }
  .tile.level-tile.tile-active { outline: 2px solid var(--l0); outline-offset: 2px; border-color: transparent; font-weight: 600; }
  .tile-caption { font-size: 12px; font-weight: 300; color: var(--mute); margin-top: 8px; }
  .nsw { width: 56px; border: 1px solid var(--g3); background: #171515; cursor: pointer; overflow: hidden; border-radius: 2px; }
  .nsw:hover { border-color: var(--l1); }
  .nsw-color { height: 34px; }
  .nsw-label { font-size: 12px; text-align: center; padding: 5px 0 6px; color: var(--l1); letter-spacing: 0.04em; }
  .nsw.active { outline: 2px solid var(--l0); outline-offset: 2px; border-color: transparent; }
  .nsw.active .nsw-label { color: #fff; font-weight: 700; }
  .nuance-sub-panel { margin-top: 12px; padding: 4px 0 4px 14px; border-left: 2px solid var(--violet); }

  .relation-badge { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 2px; margin-left: 8px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid currentColor; vertical-align: middle; }
  .badge-kb { color: #ff5470; } .badge-hb { color: #3fb4e8; } .badge-pre { color: #ff8a4c; }

  .result { margin-top: 12px; padding: 4px 0 0; }
  .result-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; font-size: 13px; border-bottom: 1px solid var(--g2); }
  .result-label { color: var(--mute); font-weight: 300; }
  .result-value { font-weight: 600; text-align: right; color: #fff; }
  .figures { display: flex; gap: 12px 34px; margin-top: 16px; flex-wrap: wrap; }
  .fig .num { font-size: 40px; font-weight: 200; line-height: 1.05; color: #fff; letter-spacing: 0.01em; }
  .fig .num.long { font-size: 20px; font-weight: 300; line-height: 1.35; padding-top: 8px; }
  .fig .cap { margin-top: 6px; font-size: 10px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); }
  .recipe-title { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mute); margin: 0 0 4px; }
  .recipe-h { margin: 0 0 16px; font-size: 22px; font-weight: 200; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; line-height: 1.2; }
  .recipe-h.pre { color: #ff7a8e; }

  .warning { margin-top: 12px; padding: 10px 14px; background: rgba(213,28,57,0.12); border-left: 2px solid var(--red); font-size: 13px; font-weight: 300; }
  .pretreat { margin-top: 12px; padding: 14px 16px; background: rgba(233,108,46,0.12); border-left: 2px solid var(--orange); font-size: 13px; }
  .pretreat-result { margin-top: 12px; padding: 12px 14px; background: rgba(255,255,255,0.06); font-size: 13px; font-weight: 300; }
  .gap { margin-top: 12px; padding: 10px 14px; background: rgba(255,255,255,0.04); border-left: 2px solid var(--g3); font-size: 12px; font-weight: 300; color: var(--l1); }
  .summary { font-size: 12px; font-weight: 300; color: var(--mute); margin-bottom: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--g2); letter-spacing: 0.02em; }

  .action-row { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; align-items: center; }
  .action-btn { padding: 14px 22px; border-radius: 2px; border: 1px solid var(--g3); background: transparent; color: var(--l0); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
  .action-btn:hover { border-color: var(--l0); background: rgba(255,255,255,0.06); }
  .offer-btn { padding: 15px 26px; border-radius: 2px; background: var(--magenta); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; }
  .offer-btn:hover { background: #e8307a; }

  .care-block { margin-top: 34px; padding-top: 24px; border-top: 1px solid var(--g2); }
  .care-title { font-size: 11px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }
  .care-h { font-size: 22px; font-weight: 200; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; margin-bottom: 6px; }
  .care-sub { font-size: 12px; font-weight: 300; color: var(--mute); margin-bottom: 8px; }
  .care-group { margin-top: 18px; }
  .care-group-title { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--l1); margin-bottom: 6px; }
  .care-item { display: flex; gap: 14px; align-items: flex-start; padding: 10px 12px; margin-top: 6px; background: rgba(255,255,255,0.035); border: 1px solid var(--g2); border-left: 2px solid var(--g3); font-size: 13px; }
  .care-item.rec { border-left-color: var(--orange); }
  .care-name { font-weight: 600; color: #fff; }
  .care-why { color: var(--l1); font-weight: 300; margin-top: 2px; }
  .care-tag { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--orange); color: #ff8a4c; margin-left: 8px; vertical-align: middle; }
  .care-img { flex: 0 0 62px; height: 78px; border: 1px dashed var(--g3); background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--g3); overflow: hidden; }
  .care-img img { width: 100%; height: 100%; object-fit: contain; }

  .offer-panel { margin-top: 18px; padding: 22px 20px; background: rgba(255,255,255,0.04); border: 1px solid var(--magenta); }
  .offer-head { font-size: 18px; font-weight: 200; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; }
  .offer-sub { font-size: 12px; font-weight: 300; color: var(--mute); margin: 4px 0 8px; }
  .offer-cat { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--l1); margin-top: 18px; }
  .offer-item { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--g2); padding: 10px 12px; margin-top: 6px; cursor: pointer; font-size: 13px; }
  .offer-item:hover { border-color: var(--g3); }
  .offer-item.on { border-color: var(--magenta); background: rgba(217,25,100,0.1); }
  .offer-check { flex: 0 0 20px; height: 20px; border: 1px solid var(--g3); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; border-radius: 2px; }
  .offer-item.on .offer-check { background: var(--magenta); border-color: var(--magenta); }
  .offer-name { font-weight: 600; color: #fff; }
  .offer-why { color: var(--l1); font-weight: 300; margin-top: 2px; }
  .offer-rec { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--magenta); color: #ff5fa0; margin-left: 8px; vertical-align: middle; }
  .offer-save { margin-top: 20px; padding: 16px; text-align: center; background: var(--l0); color: var(--g0); font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; }
  .offer-save:hover { background: #fff; }

  .safety { margin-top: 30px; padding: 20px 18px; border: 1px solid var(--g2); border-top: 2px solid var(--orange); }
  .safety-title { font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #fff; }
  .safety-sub { font-size: 12px; font-weight: 300; color: var(--mute); margin: 4px 0 6px; }
  .safety-group { margin-top: 16px; }
  .safety-group-title { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--l1); }
  .safety ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; font-weight: 300; color: var(--l0); }
  .safety li { margin: 5px 0; }
  .safety .src { font-size: 11px; color: var(--mute); }

  /* ---------- нижнее меню ---------- */
  .footer-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(23,21,21,0.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--g2); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .footer-inner { max-width: 780px; margin: 0 auto; display: flex; }
  .fnav { flex: 1; padding: 11px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--mute); cursor: pointer; border-top: 2px solid transparent; margin-top: -1px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
  .fnav:hover { color: #fff; }
  .fnav.active { color: #fff; border-top-color: var(--cobalt); }
  .fnav.disabled { opacity: 0.38; cursor: default; }
  .fnav.disabled:hover { color: var(--mute); }
  .fnav svg { display: block; }

  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>
